name: vacansa
description: Partner Financial Portal — Vacansa mobile and web app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.8.1
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8
  fpdart: ^1.1.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  logger: ^2.5.0
  intl: ^0.20.2
  fl_chart: ^0.70.2
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.3
  printing: ^5.14.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  liquid_glass_widgets:
    path: liquid_glass_widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
