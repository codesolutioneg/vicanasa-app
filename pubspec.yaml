name: vacansa
description: Partner Financial Portal — Vacansa mobile and web app.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.8.1
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8
  fpdart: ^1.1.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  logger: ^2.5.0
  intl: ^0.20.2
  fl_chart: ^0.70.2
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.3
  printing: ^5.14.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  liquid_glass_widgets: ^0.13.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_dotenv: ^5.2.1
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  change_app_package_name: ^1.5.0

dependency_overrides:
  # Avoid App Store archive dSYM / malformed framework issues (dart-lang/native#3004).
  objective_c: 9.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
          weight: 900
